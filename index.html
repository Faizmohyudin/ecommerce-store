<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyStore - Home</title>
    <link rel="stylesheet" href="./styling/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="logo">MyStore</div>
      <div class="cart-btn" id="cartBtn">
        <a href="cart.html">
          <i class="fas fa-shopping-cart"></i>
          <span id="cartCount">0</span>
        </a>
      </div>
    </header>

    <div class="main-container">
      <!-- Categories Filter Bar -->
      <div class="categories-bar">
        <button class="cat-btn active" data-category="all">All</button>
        <button class="cat-btn" data-category="mobile">Mobiles</button>
        <button class="cat-btn" data-category="laptop">Laptops</button>
        <button class="cat-btn" data-category="accessories">Accessories</button>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="productGrid">
        <!-- JavaScript se products yahan inject honge -->
      </div>
    </div>

    <script src="./javascript/script.js"></script>
  </body>
</html>
