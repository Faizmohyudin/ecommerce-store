<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - WhatsApp Order</title>
    <link rel="stylesheet" href="./styling/style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">MyStore</div>
        <a href="cart.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back to Cart</a>
    </header>

    <div class="checkout-container">
        <div class="checkout-box">
            <h2>Enter Delivery Details</h2>
            <form id="whatsappCheckoutForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="customerName" required placeholder="Ahmad Ali">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="customerPhone" required placeholder="03001234567">
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea id="customerAddress" required placeholder="House #, Street, City"></textarea>
                </div>
                <button type="submit" class="btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> Order on WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script src="./javascript/checkout.js"></script>
</body>
</html>
